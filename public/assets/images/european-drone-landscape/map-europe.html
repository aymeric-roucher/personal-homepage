<style>

    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
  .wrap { padding: 6px 8px; position: relative; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 2px 2px 8px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-2);

  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .chip.off { opacity: 0.35; }
  .hint { font-size: 12px; color: var(--muted); margin-left: auto; }
  svg { width: 100%; height: auto; display: block; }
  .country { fill: var(--land); stroke: var(--border); stroke-width: 0.7; }
  .bubble { stroke: #fff; stroke-width: 1.2; cursor: pointer; transition: opacity .12s; }
  .bubble.na { fill: none !important; stroke-width: 1.6; }
  .blabel { font-size: 10.5px; fill: var(--ink-2); paint-order: stroke; stroke: rgba(255,255,255,0.85); stroke-width: 2.5px; pointer-events: none; }
  .hub { fill: rgba(82,81,78,0.05); stroke: #52514e; stroke-width: 1.1; stroke-dasharray: 4 3; cursor: pointer; }
  .hub:hover { fill: rgba(82,81,78,0.12); }
  .hub-label { font-size: 9.5px; fill: #898781; text-transform: uppercase; letter-spacing: .06em;
    paint-order: stroke; stroke: rgba(255,255,255,0.85); stroke-width: 2.5px; pointer-events: none; }
  .tooltip { position: absolute; z-index: 10; width: 320px; max-width: 92vw; background: var(--surface);
    border: 1px solid var(--ring); border-radius: 8px; box-shadow: 0 6px 24px rgba(11,11,11,0.13);
    padding: 11px 13px; font-size: 12.5px; line-height: 1.42; display: none; pointer-events: none; }
  .tooltip.pinned { pointer-events: auto; }
  .tooltip a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
  .tt-name { color: var(--ink); font-weight: 650; font-size: 14px; }
  .tt-flag { font-weight: 500; color: var(--muted); font-size: 11px; margin-left: 5px; }
  .tt-hq { color: var(--muted); font-size: 11.5px; margin: 1px 0 6px; display: flex; align-items: center; gap: 6px; }
  .tt-hq .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  /* the stat block: label dim, number big+bold, qualifier dim */
  .tt-stat { display: grid; grid-template-columns: auto 1fr; gap: 1px 8px; align-items: baseline; margin-bottom: 6px; }
  .tt-stat .lbl { color: var(--muted); font-size: 11px; }
  .tt-stat .val { color: var(--ink); }
  .tt-stat .val b { font-size: 15px; font-weight: 680; letter-spacing: -0.01em; }
  .tt-stat .val .q { color: var(--muted); font-weight: 400; font-size: 12px; }
  .tt-src { grid-column: 2; font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .tt-desc { margin-bottom: 6px; }
  .tt-wins { margin: 0 0 2px; padding-left: 15px; }
  .tt-wins li { margin-bottom: 3px; }
  .tt-caveat { margin-top: 6px; color: var(--muted); font-style: italic; }
  .tt-detail { margin-top: 6px; font-size: 11.5px; }
  .tt-detail summary { color: var(--muted); cursor: pointer; font-size: 11px; }
  .tt-detail p { margin: 4px 0 0; color: var(--ink-2); }
  .foot { display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .sizekey { display: flex; align-items: flex-end; gap: 6px; }
</style>
</head>

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
const W = 960, H = 760;
const svg = document.getElementById('map');
const tt = document.getElementById('tt');
const HUBS = [
  { name: 'Munich', lat: 48.14, lon: 11.58, desc: "Europe's number-one defense-tech hub: $1.7B of VC in 2025 (43% into Helsing alone). Helsing, Quantum Systems, ARX, Alpine Eagle, Tytan, plus Stark's first plant." },
  { name: 'Rzeszow', lat: 50.04, lon: 22.00, desc: "Poland's 'Aviation Valley' aerospace cluster and the Jasionka logistics gateway for aid into Ukraine. Dronehub's home turf, in WB Group's orbit." },
  { name: 'Kyiv', lat: 50.45, lon: 30.52, desc: "The battle-lab: the Brave1 cluster, DOT-Chain e-Points procurement, and 500+ makers from Vyriy to The Fourth Law." },
  { name: 'Toulouse', lat: 43.60, lon: 1.44, desc: "France's 'Aerospace Valley': Delair, Alta Ares and EOS Technologie growing in Airbus's shadow." },
  { name: 'Paris', lat: 48.86, lon: 2.35, desc: "The DGA's orbit: Harmattan, Comand AI, Parrot and Dronavia." },
  { name: 'Zurich', lat: 47.38, lon: 8.54, desc: "The Swiss commercial cluster: Auterion, Wingtra, Verity, Voliro and Daedalean, with Flyability and RigiTech on Lake Geneva." },
  { name: 'Odense', lat: 55.40, lon: 10.39, desc: "UAS Denmark Test Center: 1,900 km2 of dedicated beyond-visual-line-of-sight test airspace." },
  { name: 'Tallinn', lat: 59.44, lon: 24.75, desc: "The Baltic edge, closest to the threat: Milrem, Frankenburg, KrattWorks and Threod, with ANRA's EASA-certified traffic services in Tartu." },
  { name: 'Swindon', lat: 51.56, lon: -1.78, desc: "The UK build-out: Europe's biggest drone test centre plus Stark's and Tekever's new factories; London-Cambridge raised $2.4B in 2025." },
];

const legendEl = document.getElementById('legend');
const hidden = new Set();
let pinned = null;

const DEG = Math.PI / 180, LAT0 = 52 * DEG, LON0 = 10 * DEG;
function project(lat, lon) {
  const phi = lat * DEG, lam = lon * DEG - LON0;
  const k = Math.sqrt(2 / (1 + Math.sin(LAT0) * Math.sin(phi) + Math.cos(LAT0) * Math.cos(phi) * Math.cos(lam)));
  return [k * Math.cos(phi) * Math.sin(lam), -k * (Math.cos(LAT0) * Math.sin(phi) - Math.sin(LAT0) * Math.cos(phi) * Math.cos(lam))];
}
let SCALE = 1, TX = 0, TY = 0;
function fit(features) {
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const f of features) {
    const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    for (const poly of polys) for (const ring of poly) for (const [lon, lat] of ring) {
      const [x, y] = project(lat, lon);
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
  }
  // fit to width, then crop the empty northern strip the Lambert projection
  // leaves above the landmass, and size the viewBox to match.
  SCALE = (W - 20) / (maxX - minX);
  const landH = (maxY - minY) * SCALE;
  const cropTop = 0.19 * landH;
  TX = 10 - minX * SCALE;
  TY = 10 - minY * SCALE - cropTop;
  const vbH = Math.round(landH + 20 - cropTop);
  svg.setAttribute('viewBox', `0 0 ${W} ${vbH}`);
}
const px = (lat, lon) => { const [x, y] = project(lat, lon); return [x * SCALE + TX, y * SCALE + TY]; };
const R_NA = 6;
const radius = (sz) => sz == null ? R_NA : Math.max(5.2, 0.62 * Math.sqrt(sz));
function el(tag, attrs) {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

fetch('europe.geo.json').then(r => r.json()).then(geo => {
  fit(geo.features);
  const gLand = el('g', {}); svg.appendChild(gLand);
  for (const f of geo.features) {
    const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    let d = '';
    for (const poly of polys) for (const ring of poly) {
      ring.forEach(([lon, lat], i) => { const [x, y] = px(lat, lon); d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1); });
      d += 'Z';
    }
    gLand.appendChild(el('path', { d, class: 'country' }));
  }

  const gHubs = el('g', {}); svg.appendChild(gHubs);
  for (const h of HUBS) {
    const [hx, hy] = px(h.lat, h.lon);
    const ring = el('circle', { class: 'hub', cx: hx.toFixed(1), cy: hy.toFixed(1), r: 16 });
    gHubs.appendChild(ring);
    const lbl = el('text', { class: 'hub-label', x: hx.toFixed(1), y: (hy + 27).toFixed(1), 'text-anchor': 'middle' });
    lbl.textContent = h.name; gHubs.appendChild(lbl);
    ring.addEventListener('mouseenter', (e) => { if (!pinned) showHub(h, e); });
    ring.addEventListener('mousemove', (e) => { if (!pinned) placeTT(e); });
    ring.addEventListener('mouseleave', () => { if (!pinned) hideTT(); });
  }

  const nodes = COMPANIES.map((c, i) => {
    const [x, y] = px(c.lat, c.lon);
    const jx = Math.cos(i * 2.3999) * 1.5, jy = Math.sin(i * 2.3999) * 1.5;
    return { c, x: x + jx, y: y + jy, ax: x, ay: y, r: radius(c.sz) };
  });
  for (let it = 0; it < 260; it++) {
    for (const n of nodes) { const k = n.r >= 14 ? 0.14 : 0.04; n.x += (n.ax - n.x) * k; n.y += (n.ay - n.y) * k; }
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy);
      if (dist < 0.01) { dx = 1; dy = 0; dist = 0.01; }
      const gap = a.r + b.r + 1.5;
      if (dist < gap) {
        const push = gap - dist, ma = a.r * a.r, mb = b.r * b.r;
        dx /= dist; dy /= dist;
        a.x -= dx * push * (mb / (ma + mb)); a.y -= dy * push * (mb / (ma + mb));
        b.x += dx * push * (ma / (ma + mb)); b.y += dy * push * (ma / (ma + mb));
      }
    }
  }

  const gB = el('g', {}); svg.appendChild(gB);
  const gL = el('g', {}); svg.appendChild(gL);
  nodes.sort((a, b) => b.r - a.r);
  for (const n of nodes) {
    const seg = SEGMENTS[n.c.seg];
    const b = el('circle', { cx: n.x.toFixed(1), cy: n.y.toFixed(1), r: n.r.toFixed(1),
      class: 'bubble' + (n.c.sz == null ? ' na' : ''), 'data-seg': n.c.seg });
    b.style.fill = seg.hex; b.style.fillOpacity = 0.8;
    if (n.c.sz == null) b.style.stroke = seg.hex;
    b.addEventListener('mouseenter', (e) => { if (!pinned) showTT(n, e); });
    b.addEventListener('mousemove', (e) => { if (!pinned) placeTT(e); });
    b.addEventListener('mouseleave', () => { if (!pinned) hideTT(); });
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      if (pinned === n) { pinned = null; hideTT(); }
      else { pinned = null; showTT(n, e); pinned = n; tt.classList.add('pinned'); }
    });
    n.elt = b; gB.appendChild(b);
  }

  const labeled = nodes.filter(n => (n.c.sz || 0) >= 90);
  const placed = [];
  for (const n of labeled) {
    const wEst = n.c.name.length * 5.6, hEst = 11;
    const candidates = [
      { x: n.x + n.r + 3, y: n.y + 3, anchor: 'start' },
      { x: n.x - n.r - 3, y: n.y + 3, anchor: 'end' },
      { x: n.x, y: n.y - n.r - 4, anchor: 'middle' },
      { x: n.x, y: n.y + n.r + 11, anchor: 'middle' },
    ];
    let best = candidates[0];
    for (const cand of candidates) {
      const x0 = cand.anchor === 'start' ? cand.x : cand.anchor === 'end' ? cand.x - wEst : cand.x - wEst / 2;
      const box = { x0, x1: x0 + wEst, y0: cand.y - hEst, y1: cand.y };
      const hitsLabel = placed.some(p => box.x0 < p.x1 && box.x1 > p.x0 && box.y0 < p.y1 && box.y1 > p.y0);
      if (!hitsLabel) { best = cand; break; }
    }
    const bx0 = best.anchor === 'start' ? best.x : best.anchor === 'end' ? best.x - wEst : best.x - wEst / 2;
    placed.push({ x0: bx0, x1: bx0 + wEst, y0: best.y - hEst, y1: best.y });
    const t = el('text', { x: best.x.toFixed(1), y: best.y.toFixed(1), class: 'blabel', 'text-anchor': best.anchor });
    t.textContent = n.c.name; gL.appendChild(t);
  }

  document.body.addEventListener('click', () => { pinned = null; hideTT(); });
  tt.addEventListener('click', (e) => e.stopPropagation());

  for (const key in SEGMENTS) {
    const seg = SEGMENTS[key];
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = `<span class="dot" style="background:${seg.hex}"></span>${seg.label}`;
    chip.addEventListener('click', () => {
      if (hidden.has(key)) hidden.delete(key); else hidden.add(key);
      chip.classList.toggle('off', hidden.has(key));
      for (const n of nodes) { const off = hidden.has(n.c.seg); n.elt.style.opacity = off ? 0.06 : 1; n.elt.style.pointerEvents = off ? 'none' : 'auto'; }
    });
    legendEl.appendChild(chip);
  }
  const hubChip = document.createElement('span');
  hubChip.className = 'chip';
  hubChip.innerHTML = `<svg viewBox="0 0 12 12" style="width:12px;height:12px;flex:none;display:inline-block"><circle cx="6" cy="6" r="4.6" fill="none" stroke="#52514e" stroke-width="1.1" stroke-dasharray="3 2"/></svg>Ecosystem hubs`;
  legendEl.appendChild(hubChip);
  const hint = document.createElement('span');
  hint.className = 'hint';
  hint.textContent = 'startups & scaleups only; legacy primes appear as buyers inside the cards';
  legendEl.appendChild(hint);

  const sk = document.getElementById('sizekey');
  const lab = document.createElement('span'); lab.textContent = 'raised:'; sk.appendChild(lab);
  const key = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  const KH = 54, baseCx = 28, baseY = KH - 2;
  key.setAttribute('viewBox', `0 0 110 ${KH}`); key.setAttribute('width', '110'); key.setAttribute('height', KH);
  [[1500, '€1.5B'], [500, '€500M'], [100, '€100M']].forEach(([v, txt]) => {
    const r = radius(v), cy = baseY - r;
    key.appendChild(el('circle', { cx: baseCx, cy: cy.toFixed(1), r: r.toFixed(1), fill: 'none', stroke: '#898781', 'stroke-width': 1 }));
    key.appendChild(el('line', { x1: baseCx, y1: (cy - r).toFixed(1), x2: baseCx + 32, y2: (cy - r).toFixed(1), stroke: '#c3c2b7', 'stroke-width': 0.6, 'stroke-dasharray': '2,2' }));
    const t = el('text', { x: baseCx + 34, y: (cy - r + 3).toFixed(1), 'font-size': 8.5, fill: '#898781' }); t.textContent = txt; key.appendChild(t);
  });
  sk.appendChild(key);

  if (location.hash === '#demo') {
    const n = nodes[0];
    showTT(n, { clientX: n.x + 60, clientY: n.y + 120 }); pinned = n; tt.classList.add('pinned');
  }
});

function showTT(n, e) {
  const c = n.c, seg = SEGMENTS[c.seg];
  const srcLine = (c.src || []).map(([t, u]) => A(u, t)).join(' · ');
  tt.innerHTML = `
    <div class="tt-name">${c.name}${c.flag ? `<span class="tt-flag">${c.flag}</span>` : ''}</div>
    <div class="tt-hq"><span class="dot" style="background:${seg.hex}"></span>${seg.label} · ${c.hq}${c.founded ? ` · ${c.founded}` : ''}</div>
    <div class="tt-stat">
      <span class="lbl">Raised</span>
      <span class="val"><b>${c.raised || 'n/a'}</b>${c.note ? ` <span class="q">${c.note}</span>` : ''}</span>
      ${c.val ? `<span class="lbl">Valued</span><span class="val"><span class="q">${c.val}</span></span>` : ''}
      ${srcLine ? `<span class="tt-src">${srcLine}</span>` : ''}
    </div>
    <div class="tt-desc">${c.desc}</div>
    ${c.wins && c.wins.length ? `<ul class="tt-wins">${c.wins.map(w => `<li>${w}</li>`).join('')}</ul>` : ''}
    ${c.caveat ? `<div class="tt-caveat">⚠ ${c.caveat}</div>` : ''}
    ${c.detail ? `<details class="tt-detail"><summary>detail</summary><p>${c.detail}</p></details>` : ''}`;
  tt.style.display = 'block';
  tt.classList.remove('pinned');
  placeTT(e);
}
function showHub(h, e) {
  tt.innerHTML = `
    <div class="tt-name">${h.name}<span class="tt-flag">ecosystem hub</span></div>
    <div class="tt-desc">${h.desc}</div>`;
  tt.style.display = 'block';
  tt.classList.remove('pinned');
  placeTT(e);
}
function placeTT(e) {
  const wrap = document.querySelector('.wrap').getBoundingClientRect();
  const x = e.clientX - wrap.left, y = e.clientY - wrap.top;
  const w = tt.offsetWidth, h = tt.offsetHeight;
  let left = x + 14, top = y + 10;
  if (left + w > wrap.width - 4) left = x - w - 14;
  if (left < 4) left = 4;
  if (top + h > wrap.height - 4) top = Math.max(4, y - h - 10);
  tt.style.left = left + 'px'; tt.style.top = top + 'px';
}
function hideTT() { tt.style.display = 'none'; tt.classList.remove('pinned'); }

// Same-origin: size our own iframe to content so there is never a gap or scrollbar.
if (window.frameElement) {
  const resize = () => { window.frameElement.style.height = document.documentElement.scrollHeight + 'px'; };
  if (window.ResizeObserver) new ResizeObserver(resize).observe(document.documentElement);
  window.addEventListener('load', resize);
  setTimeout(resize, 400);
}
</script>
