  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2);

  .chip .dia { width: 9px; height: 9px; transform: rotate(45deg); }
  .chip.off { opacity: 0.35; }
  .hint { font-size: 11.5px; color: var(--muted); margin-left: auto; }
  svg { width: 100%; height: auto; display: block; }
  .country { fill: var(--land); stroke: var(--border); stroke-width: 0.4; }
  .bubble, .comp { stroke: #fff; stroke-width: 1; cursor: pointer; transition: opacity .12s; }
  .bubble.na { fill: none !important; stroke-width: 1.4; }
  .blabel { font-size: 9.5px; fill: var(--ink-2); paint-order: stroke; stroke: rgba(255,255,255,0.85); stroke-width: 2.2px; pointer-events: none; }
  .facts { margin: 10px 2px 2px; padding: 9px 11px; border: 1px solid var(--ring); border-radius: 8px; background: #fbfbf9; font-size: 12px; line-height: 1.5; }
  .facts b { color: var(--ink); }
  .facts a, .tooltip a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
  .foot { font-size: 11.5px; color: var(--muted); margin-top: 8px; }
  .tooltip { position: absolute; z-index: 10; width: 310px; max-width: 92vw; background: var(--surface);
    border: 1px solid var(--ring); border-radius: 8px; box-shadow: 0 6px 24px rgba(11,11,11,0.13);
    padding: 11px 13px; font-size: 12.5px; line-height: 1.42; display: none; pointer-events: none; }
  .tooltip.pinned { pointer-events: auto; }
  .tt-name { color: var(--ink); font-weight: 650; font-size: 14px; }
  .tt-flag { font-weight: 500; color: var(--muted); font-size: 11px; margin-left: 5px; }
  .tt-hq { color: var(--muted); font-size: 11.5px; margin: 1px 0 6px; display: flex; align-items: center; gap: 6px; }
  .tt-hq .m { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .tt-stat { display: grid; grid-template-columns: auto 1fr; gap: 1px 8px; align-items: baseline; margin-bottom: 6px; }
  .tt-stat .lbl { color: var(--muted); font-size: 11px; }
  .tt-stat .val b { font-size: 15px; font-weight: 680; color: var(--ink); }
  .tt-stat .val .q { color: var(--muted); font-weight: 400; font-size: 12px; }
  .tt-src { grid-column: 2; font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .tt-desc { margin-bottom: 5px; }
  .tt-wins { margin: 0; padding-left: 15px; } .tt-wins li { margin-bottom: 3px; }
</style>

    desc: "Chinese AI SoC giving non-Western drones onboard target recognition without NVIDIA, reportedly inside Russian Lancet-successors.", wins: [] },
];

const svg = document.getElementById('map'), tt = document.getElementById('tt'), legendEl = document.getElementById('legend');
const hidden = new Set(); let pinned = null;
function el(tag, a) { const n = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in a) n.setAttribute(k, a[k]); return n; }
const W = 1180, H = 320;

// equirectangular with cos(midlat) x-correction
const MIDLAT = 42, KX = Math.cos(MIDLAT * Math.PI / 180);
const raw = (lat, lon) => [lon * KX, -lat];
let SC = 1, TX = 0, TY = 0;
function fit(features) {
  let a = 1e9, b = -1e9, c = 1e9, d = -1e9;
  for (const f of features) { const ps = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    for (const poly of ps) for (const ring of poly) for (const [lon, lat] of ring) { const [x, y] = raw(lat, lon); if (x<a)a=x; if(x>b)b=x; if(y<c)c=y; if(y>d)d=y; } }
  SC = Math.min((W - 16) / (b - a), (H - 16) / (d - c)); TX = 8 - a * SC; TY = 8 - c * SC;
}
const px = (lat, lon) => { const [x, y] = raw(lat, lon); return [x * SC + TX, y * SC + TY]; };
const radius = (co) => co.kind === 'supplier' ? 8 : (co.valB != null ? Math.max(7, 3.6 * Math.sqrt(co.valB)) : ({1:8,2:11,3:15}[co.tier || 2]));

fetch('world.geo.json').then(r => r.json()).then(geo => {
  fit(geo.features);
  const gL = el('g', {}); svg.appendChild(gL);
  for (const f of geo.features) { const ps = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates; let d = '';
    for (const poly of ps) for (const ring of poly) { ring.forEach(([lon, lat], i) => { const [x, y] = px(lat, lon); d += (i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1); }); d += 'Z'; }
    gL.appendChild(el('path', { d, class: 'country' })); }

  const nodes = CO.map((co, i) => { const [x, y] = px(co.lat, co.lon); const j = i * 2.4;
    return { co, x: x + Math.cos(j) * 1.5, y: y + Math.sin(j) * 1.5, ax: x, ay: y, r: radius(co) }; });
  for (let it = 0; it < 240; it++) {
    for (const n of nodes) { const k = n.r >= 20 ? 0.12 : 0.05; n.x += (n.ax - n.x) * k; n.y += (n.ay - n.y) * k; }
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) { const A2 = nodes[i], B = nodes[j];
      let dx = B.x - A2.x, dy = B.y - A2.y, dist = Math.hypot(dx, dy); if (dist < 0.01) { dx = 1; dy = 0; dist = 0.01; }
      const gap = A2.r + B.r + 1.5; if (dist < gap) { const p = gap - dist, ma = A2.r*A2.r, mb = B.r*B.r; dx/=dist; dy/=dist;
        A2.x -= dx*p*(mb/(ma+mb)); A2.y -= dy*p*(mb/(ma+mb)); B.x += dx*p*(ma/(ma+mb)); B.y += dy*p*(ma/(ma+mb)); } }
    for (const n of nodes) { n.x = Math.max(n.r+1, Math.min(W-n.r-1, n.x)); n.y = Math.max(n.r+1, Math.min(H-n.r-1, n.y)); }
  }

  const gB = el('g', {}); svg.appendChild(gB); const gT = el('g', {}); svg.appendChild(gT);
  nodes.sort((a, b) => b.r - a.r);
  for (const n of nodes) { const co = n.co, isSup = co.kind === 'supplier'; const color = isSup ? 'var(--supplier)' : `var(--${co.region})`;
    let m; if (isSup) { const s = n.r; m = el('rect', { x: (n.x-s).toFixed(1), y: (n.y-s).toFixed(1), width: (2*s).toFixed(1), height: (2*s).toFixed(1), transform: `rotate(45 ${n.x.toFixed(1)} ${n.y.toFixed(1)})`, class: 'comp' }); }
    else m = el('circle', { cx: n.x.toFixed(1), cy: n.y.toFixed(1), r: n.r.toFixed(1), class: 'bubble' + (co.flag === 'public' && co.valB == null ? ' na' : '') });
    m.style.fill = color; m.style.fillOpacity = isSup ? 0.85 : 0.8;
    m.addEventListener('mouseenter', (e) => { if (!pinned) show(co, e); });
    m.addEventListener('mousemove', (e) => { if (!pinned) place(e); });
    m.addEventListener('mouseleave', () => { if (!pinned) hide(); });
    m.addEventListener('click', (e) => { e.stopPropagation(); if (pinned === co) { pinned = null; hide(); } else { pinned = null; show(co, e); pinned = co; tt.classList.add('pinned'); } });
    n.m = m; gB.appendChild(m);
    if ((co.valB || 0) >= 4 || co.tier === 3 || co.name === 'TSMC') { const right = n.x > W - 120;
      const t = el('text', { x: (right ? n.x - n.r - 3 : n.x + n.r + 3).toFixed(1), y: (n.y + 3).toFixed(1), class: 'blabel', 'text-anchor': right ? 'end' : 'start' });
      t.textContent = co.name; gT.appendChild(t); } }

  document.body.addEventListener('click', () => { pinned = null; hide(); });
  tt.addEventListener('click', (e) => e.stopPropagation());

  for (const key in REGION) { const rg = REGION[key]; const chip = document.createElement('span'); chip.className = 'chip';
    const mk = key === 'supplier' ? `<span class="dia" style="background:${rg.hex}"></span>` : `<span class="dot" style="background:${rg.hex}"></span>`;
    chip.innerHTML = mk + rg.label;
    chip.addEventListener('click', () => { hidden.has(key) ? hidden.delete(key) : hidden.add(key); chip.classList.toggle('off', hidden.has(key));
      for (const n of nodes) { const off = hidden.has(n.co.kind === 'supplier' ? 'supplier' : n.co.region); n.m.style.opacity = off ? 0.06 : 1; n.m.style.pointerEvents = off ? 'none' : 'auto'; } });
    legendEl.appendChild(chip); }
  const h = document.createElement('span'); h.className = 'hint'; h.textContent = 'Europe detailed in the first map; shown here for scale'; legendEl.appendChild(h);
});

function show(co, e) { const isSup = co.kind === 'supplier'; const color = isSup ? 'var(--supplier)' : `var(--${co.region})`;
  const srcLine = (co.src || []).map(([t, u]) => A(u, t)).join(' · ');
  tt.innerHTML = `<div class="tt-name">${co.name}${co.flag ? `<span class="tt-flag">${co.flag}</span>` : ''}</div>
    <div class="tt-hq"><span class="m" style="background:${color}"></span>${REGION[co.region].label} · ${co.hq}</div>
    <div class="tt-stat"><span class="lbl">${isSup ? 'Role' : 'Valued'}</span><span class="val"><b>${co.raised || 'n/a'}</b>${co.note ? ` <span class="q">${co.note}</span>` : ''}</span>
      ${co.val ? `<span class="lbl"></span><span class="val"><span class="q">${co.val}</span></span>` : ''}
      ${srcLine ? `<span class="tt-src">${srcLine}</span>` : ''}</div>
    <div class="tt-desc">${co.desc}</div>
    ${co.wins && co.wins.length ? `<ul class="tt-wins">${co.wins.map(w => `<li>${w}</li>`).join('')}</ul>` : ''}`;
  tt.style.display = 'block'; tt.classList.remove('pinned'); place(e); }
function place(e) { const w = document.querySelector('.wrap').getBoundingClientRect(); const x = e.clientX - w.left, y = e.clientY - w.top;
  const ww = tt.offsetWidth, hh = tt.offsetHeight; let l = x + 14, t = y + 10; if (l + ww > w.width - 4) l = x - ww - 14; if (l < 4) l = 4; if (t + hh > w.height - 4) t = Math.max(4, y - hh - 10);
  tt.style.left = l + 'px'; tt.style.top = t + 'px'; }
function hide() { tt.style.display = 'none'; tt.classList.remove('pinned'); }

document.getElementById('facts').innerHTML = `<b>The two dependencies under the whole board.</b> Nearly every advanced AI chip here, American (NVIDIA), Israeli (Hailo) or European (Axelera), is fabricated at a handful of Asian fabs, <b>TSMC in Taiwan and Samsung in Korea</b>; and the cheap parts, batteries (China makes ~75% of the world's lithium-ion cells), motors, propellers and FPV cameras, are overwhelmingly Chinese. From <b>September 2024</b> China began restricting exports of drones and dual-use parts to Western buyers while supply to Russia continued; the US mirror is the Pentagon's Blue UAS list and the FCC's move against DJI. A European-built FPV can cost <b>€20,000</b> against roughly <b>€200</b> for the Chinese equivalent. ${A('https://dronelife.com/2024/12/10/chinas-export-restrictions-on-drone-parts-could-reshape-global-supply-chains/','(DroneLife)')} ${A('https://www.easterncircles.com/newsletter-27-how-china-has-become-world-leader-of-fpv-drones-and-what-it-means-for-european-strategic-autonomy/','(supply-chain analysis)')}`;

// Same-origin: size our own iframe to content so there is never a gap or scrollbar.
if (window.frameElement) {
  const resize = () => { window.frameElement.style.height = document.documentElement.scrollHeight + 'px'; };
  if (window.ResizeObserver) new ResizeObserver(resize).observe(document.documentElement);
  window.addEventListener('load', resize);
  setTimeout(resize, 400);
}
</script>
</body>
</html>
