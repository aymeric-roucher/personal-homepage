<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The dissonance surface: every three-note chord</title>
<style>
  :root {
    --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --blue: #2a78d6;
  }
  html, body { margin: 0; background: var(--surface); color: var(--ink-2);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
  #plot { width: 100%; height: 520px; }
  .hint { color: var(--muted); padding: 0 14px 10px; font-size: 13px; }
  .loading { color: var(--muted); padding: 40px; text-align: center; }
</style>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
</head>
<body>
<div id="plot"><div class="loading">Loading the dissonance surface…</div></div>
<div class="hint">Every point is a three-note chord: the root at middle C plus two notes at the given frequency ratios. Drag to rotate. <strong>Click any point to hear that chord</strong>: valleys are in tune, peaks are not.</div>
<script>
const F0 = 261.6256;

let audioCtx = null;
function playTriad(r1, r2) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const now = audioCtx.currentTime;
  const dur = 2.2;
  const master = audioCtx.createGain();
  master.gain.value = 0.16;
  master.connect(audioCtx.destination);
  for (const mult of [1, r1, r2]) {
    for (let k = 1; k <= 6; k++) {
      const f = F0 * mult * k;
      if (f > 12000) continue;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(0.25 / k, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g); g.connect(master);
      o.start(now); o.stop(now + dur + 0.05);
    }
  }
}

fetch('dissonance_surface_3d.json')
  .then(r => r.json())
  .then(fig => {
    const el = document.getElementById('plot');
    el.innerHTML = '';
    fig.layout.height = 520;
    Plotly.newPlot(el, fig.data, fig.layout, { responsive: true, displayModeBar: false });
    el.on('plotly_click', (data) => {
      const pt = data.points[0];
      if (pt && typeof pt.x === 'number' && typeof pt.y === 'number') playTriad(pt.x, pt.y);
    });
  })
  .catch(err => {
    document.getElementById('plot').innerHTML = '<div class="loading">Could not load the surface data.</div>';
    console.error(err);
  });
</script>
</body>
</html>
