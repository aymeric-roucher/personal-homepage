<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interval explorer: hear the dissonance curve</title>
<style>
  :root {
    --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --blue: #2a78d6; --orange: #eb6834; --ring: rgba(11,11,11,0.10);
  }
  html, body { margin: 0; background: var(--surface); color: var(--ink-2);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
  .wrap { padding: 12px 14px; }
  canvas { width: 100%; height: 240px; display: block; border: 1px solid var(--ring); border-radius: 6px; cursor: crosshair; }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
  button { background: var(--blue); color: #fff; border: none; border-radius: 6px;
    padding: 7px 14px; font-size: 14px; cursor: pointer; font-family: inherit; }
  button.preset { background: transparent; color: var(--ink-2); border: 1px solid var(--grid); padding: 4px 10px; font-size: 13px; }
  button.preset:hover { border-color: var(--blue); color: var(--blue); }
  button:hover { opacity: 0.92; }
  input[type=range] { accent-color: var(--blue); }
  #ratio { width: 260px; }
  select { font-family: inherit; font-size: 13px; background: var(--surface); color: var(--ink-2);
    border: 1px solid var(--grid); border-radius: 6px; padding: 4px 6px; }
  .readout { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 120px; }
  .hint { color: var(--muted); margin-top: 6px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="curve" width="1600" height="480"></canvas>
  <div class="row">
    <button id="play">▶ Play interval</button>
    <label>Interval <input id="ratio" type="range" min="1" max="2.1" step="0.001" value="1.5"></label>
    <span class="readout" id="readout"></span>
  </div>
  <div class="row">
    <label>Overtones per note
      <input id="partials" type="range" min="1" max="8" step="1" value="6" style="width:120px">
      <span id="nval">6</span>
    </label>
    <label>Timbre
      <select id="timbre">
        <option value="harmonic">string / pipe (harmonic)</option>
        <option value="stretched">stretched (n^0.95)</option>
        <option value="bar">metal bar (bell-like)</option>
      </select>
    </label>
  </div>
  <div class="row" id="presets">
    <button class="preset" data-r="1.25">major third 5/4</button>
    <button class="preset" data-r="1.2599">tempered third</button>
    <button class="preset" data-r="1.3333">fourth 4/3</button>
    <button class="preset" data-r="1.4142">tritone</button>
    <button class="preset" data-r="1.5">fifth 3/2</button>
    <button class="preset" data-r="1.52">detuned fifth</button>
    <button class="preset" data-r="2">octave 2/1</button>
  </div>
  <div class="hint">Two notes: one fixed at middle C, one you move. The curve is the computed dissonance of the pair; the dot is where you are. Click the curve or drag the slider, then play. With one overtone (a pure sine) no interval is special; each added overtone carves new valleys.</div>
</div>
<script>
// Sethares (1993) sensory dissonance, constants from his published code
const DSTAR = 0.24, S1 = 0.0207, S2 = 18.96, B1 = 3.51, B2 = 5.75;
const F0 = 261.6256; // middle C

function loudness(amp) { return Math.pow(2, 20 * Math.log10(amp) / 10) / 16; }

function partialsFor(timbre, n) {
  const mult = [], amp = [];
  for (let k = 1; k <= n; k++) {
    if (timbre === 'stretched') mult.push(Math.pow(k, 0.95));
    else if (timbre === 'bar') mult.push([1, 2.758, 5.406, 8.936, 13.35, 18.645, 24.82, 31.6][k - 1]);
    else mult.push(k);
    amp.push(1 / k);
  }
  return { freqs: mult.map(m => m * F0), louds: amp.map(loudness), amps: amp };
}

function totalDissonance(freqs, louds) {
  let d = 0;
  for (let i = 0; i < freqs.length; i++) {
    for (let j = i + 1; j < freqs.length; j++) {
      const fLow = Math.min(freqs[i], freqs[j]), fHigh = Math.max(freqs[i], freqs[j]);
      const s = DSTAR / (S1 * fLow + S2);
      const diff = fHigh - fLow;
      d += Math.min(louds[i], louds[j]) * (Math.exp(-B1 * s * diff) - Math.exp(-B2 * s * diff));
    }
  }
  return d;
}

function curveFor(timbre, n) {
  const base = partialsFor(timbre, n);
  const xs = [], ys = [];
  for (let r = 1.0; r <= 2.1001; r += 0.002) {
    const freqs = base.freqs.concat(base.freqs.map(f => f * r));
    const louds = base.louds.concat(base.louds);
    xs.push(r);
    ys.push(totalDissonance(freqs, louds));
  }
  const max = Math.max(...ys);
  return { xs, ys: ys.map(y => max > 0 ? y / max : y) };
}

const canvas = document.getElementById('curve');
const ctx = canvas.getContext('2d');
const ratioSlider = document.getElementById('ratio');
const partialsSlider = document.getElementById('partials');
const timbreSel = document.getElementById('timbre');
const readout = document.getElementById('readout');
const nval = document.getElementById('nval');
const PAD = { l: 55, r: 15, t: 15, b: 40 };
let curve = null;

function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function xToPx(r) { return PAD.l + (r - 1.0) / 1.1 * (canvas.width - PAD.l - PAD.r); }
function yToPx(d) { return PAD.t + (1 - d) * (canvas.height - PAD.t - PAD.b); }

function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.font = '22px system-ui';
  // grid + x ticks
  ctx.strokeStyle = css('--grid'); ctx.fillStyle = css('--muted'); ctx.lineWidth = 1;
  for (let r = 1.0; r <= 2.1; r += 0.1) {
    const x = xToPx(r);
    ctx.beginPath(); ctx.moveTo(x, PAD.t); ctx.lineTo(x, H - PAD.b); ctx.stroke();
    ctx.fillText(r.toFixed(1), x - 15, H - 12);
  }
  ctx.save();
  ctx.translate(16, H / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillText('dissonance', -55, 0);
  ctx.restore();
  // curve
  ctx.strokeStyle = css('--blue'); ctx.lineWidth = 3;
  ctx.beginPath();
  curve.xs.forEach((r, i) => {
    const x = xToPx(r), y = yToPx(curve.ys[i]);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
  // current position
  const r = parseFloat(ratioSlider.value);
  const idx = Math.min(curve.xs.length - 1, Math.max(0, Math.round((r - 1.0) / 0.002)));
  ctx.fillStyle = css('--orange');
  ctx.beginPath();
  ctx.arc(xToPx(curve.xs[idx]), yToPx(curve.ys[idx]), 9, 0, 2 * Math.PI);
  ctx.fill();
  readout.textContent = `ratio ${r.toFixed(3)}`;
}

function recompute() {
  nval.textContent = partialsSlider.value;
  curve = curveFor(timbreSel.value, parseInt(partialsSlider.value));
  draw();
}

let audioCtx = null;
function playInterval() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const now = audioCtx.currentTime;
  const dur = 1.8;
  const base = partialsFor(timbreSel.value, parseInt(partialsSlider.value));
  const r = parseFloat(ratioSlider.value);
  const master = audioCtx.createGain();
  master.gain.value = 0.5 / Math.sqrt(base.freqs.length);
  master.connect(audioCtx.destination);
  for (const mult of [1, r]) {
    base.freqs.forEach((f, i) => {
      if (f * mult > 12000) return;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = f * mult;
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(0.25 * base.amps[i], now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g); g.connect(master);
      o.start(now); o.stop(now + dur + 0.05);
    });
  }
}

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const px = (e.clientX - rect.left) * canvas.width / rect.width;
  const r = 1.0 + (px - PAD.l) / (canvas.width - PAD.l - PAD.r) * 1.1;
  ratioSlider.value = Math.min(2.1, Math.max(1, r)).toFixed(3);
  draw();
  playInterval();
});
document.getElementById('play').addEventListener('click', playInterval);
document.querySelectorAll('.preset').forEach(b => b.addEventListener('click', () => {
  ratioSlider.value = b.dataset.r;
  draw();
  playInterval();
}));
ratioSlider.addEventListener('input', draw);
partialsSlider.addEventListener('input', recompute);
timbreSel.addEventListener('change', recompute);
recompute();
</script>
</body>
</html>
