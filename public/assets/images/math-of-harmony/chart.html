<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dissonance chart</title>
<style>
  :root { --surface: #ffffff; --muted: #898781; }
  html, body { margin: 0; background: transparent; color: var(--muted);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
  #plot { width: 100%; }
  #plot .js-plotly-plot .plotly .cursor-crosshair,
  #plot .nsewdrag { cursor: pointer !important; }
  .hint { padding: 2px 14px 8px; }
</style>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<script src="audio.js"></script>
</head>
<body>
<div id="plot"></div>
<div class="hint" id="hint"></div>
<script>
const params = new URLSearchParams(location.search);
const figName = params.get('fig');
const mode = params.get('mode');
const F0 = 261.6256; // middle C
const HINTS = {
  pure: 'Click anywhere on the curve to hear the two pure tones at that spacing, and drag the slider to move the register.',
  harmonic6: 'Click anywhere on the curve to hear that interval (two notes with 8 harmonics each).',
  bypartials: 'Click anywhere on the curve to hear that interval with the currently selected number of harmonics.',
  bar: 'Click anywhere on the curve to hear that interval played with bar-like overtones.',
  stretched: 'Click anywhere on the curve to hear that interval with the currently selected overtone stretch.',
};
document.getElementById('hint').textContent = HINTS[mode] || 'Click the curve to hear it.';

function handleClick(el, pt) {
  const r = pt.x;
  if (typeof r !== 'number') return;
  if (mode === 'pure') {
    const s = el._fullLayout.sliders?.[0];
    const f0 = s ? parseFloat(s.steps[s.active].label) : 200;
    playInterval(f => harmonicPartials(f, 1), f0, r, 1.5);
  } else if (mode === 'bypartials') {
    const n = (el._fullLayout.sliders?.[0]?.active ?? 5) + 1;
    playInterval(f => harmonicPartials(f, n), F0, r);
  } else if (mode === 'bar') {
    playInterval(f => barPartials(f, 8), F0, r);
  } else if (mode === 'stretched') {
    const s = el._fullLayout.sliders?.[0];
    const gamma = s ? parseFloat(s.steps[s.active].label) : 1.0;
    playInterval(f => stretchedPartials(f, 8, gamma), F0, r);
  } else {
    playInterval(f => harmonicPartials(f, 8), F0, r);
  }
}

fetch(figName + '.json')
  .then(res => res.json())
  .then(fig => {
    const el = document.getElementById('plot');
    fig.layout.height = Math.max(300, window.innerHeight - 40);
    Plotly.newPlot(el, fig.data, fig.layout, { responsive: true, displayModeBar: false });
    el.on('plotly_click', data => handleClick(el, data.points[0]));
  })
  .catch(err => {
    document.getElementById('plot').textContent = 'Could not load the chart data.';
    console.error(err);
  });
</script>
</body>
</html>
